name: Test

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/workflows/push-docker.yaml'
  pull_request:
    branches:
      - '**'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/workflows/push-docker.yaml'
  workflow_dispatch:

jobs:
  test_program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.26.5'

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Run tests
        uses: robherley/go-test-action@v0
        env:
          BILIBILI_LOGIN_MODE: anonymous
          RECORDER_TEST_PROFILE_DIR: ${{ runner.temp }}/recorder-profiles/integration
        with:
          testArguments: './... -timeout 2h -skip TestZZZ_Final_'
          omit: successful

      - name: Run concurrent 3-way FLV record soak
        uses: robherley/go-test-action@v0
        env:
          BILIBILI_LOGIN_MODE: anonymous
          OUTPUT_DIR: ${{ runner.temp }}/recorder-records/zzz
          RECORDER_TEST_PROFILE_DIR: ${{ runner.temp }}/recorder-profiles/zzz
        with:
          testArguments: './internal/services/recorder -timeout 30m -run TestZZZ_Final_Concurrent3WayFlvRecord -count=1'

      - name: Run concurrent 3-way FMP4 record soak
        uses: robherley/go-test-action@v0
        env:
          BILIBILI_LOGIN_MODE: anonymous
          OUTPUT_DIR: ${{ runner.temp }}/recorder-records/zzz
          RECORDER_TEST_PROFILE_DIR: ${{ runner.temp }}/recorder-profiles/zzz
        with:
          testArguments: './internal/services/recorder -timeout 30m -run TestZZZ_Final_Concurrent3WayFmp4Record -count=1'

      - name: Upload recorder pprof profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recorder-pprof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recorder-profiles/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload ZZZ recorder records
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recorder-records-zzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recorder-records/
          if-no-files-found: ignore
          retention-days: 30
