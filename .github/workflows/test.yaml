name: Test

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/workflows/push-docker.yaml'
  pull_request:
    branches:
      - '*'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/workflows/push-docker.yaml'
  workflow_dispatch:

jobs:
  test_program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.26.3'

      - name: Setup FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Run tests
        uses: robherley/go-test-action@v0
        env:
          BILIBILI_LOGIN_MODE: anonymous
          RECORDER_TEST_PROFILE_DIR: ${{ runner.temp }}/recorder-profiles
        with:
          testArguments: './... -timeout 2h'
          omit: successful

      - name: Upload recorder pprof profiles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: recorder-pprof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recorder-profiles/
          if-no-files-found: ignore
          retention-days: 30
