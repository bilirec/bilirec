name: Publish to docker

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  artifact_name: bilirec

on:
  push:
    tags:
      - '*'
    branches:
      - '*'
    paths:
      - '**/*.go'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  test_program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Run tests
        id: test
        uses: robherley/go-test-action@v0
        env:
          BILIBILI_LOGIN_MODE: anonymous
        with:
          testArguments: '-short ./... -timeout 30m'

  publish_docker:
    needs: [ test_program ]
    if: "!contains(github.event.head_commit.message, 'wip')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.artifact_name }}
          tags: |
            type=edge
            type=sha,event=branch
            type=ref,event=tag
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64/v8, linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            FRP_TOKEN_INJECTED=${{ secrets.FRP_TOKEN }}