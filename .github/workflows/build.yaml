name: Build Go Cross Platform

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  artifact_name: bilirec
  production: ${{ github.event_name == 'release' }}

on:
  push:
    branches:
      - '**'
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/test.yaml'
      - '.github/workflows/build.yaml'
  release:
    types:
      - created
  workflow_dispatch:


jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [ "amd64", "arm64" ]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Build Linux
        run: |
          LDFLAGS="-X github.com/bilirec/bilirec/internal/modules/config.frpTokenInjected=${{ secrets.FRP_TOKEN }}"
          if [ "${{ env.production }}" = "true" ]; then
            LDFLAGS="$LDFLAGS -s -w"
          fi

          go build -ldflags "$LDFLAGS" -o ./dist/${{ env.artifact_name }}-linux-${{ matrix.goarch }} ./cmd/backend
        env:
          GOARCH: ${{ matrix.goarch }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-linux-${{ matrix.goarch }}
          path: ./dist/${{ env.artifact_name }}-linux-${{ matrix.goarch }}

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Build Windows
        run: |
          $ldflags = "-X github.com/bilirec/bilirec/internal/modules/config.frpTokenInjected=${{ secrets.FRP_TOKEN }}"
          if ("${{ env.production }}" -eq "true") {
            $ldflags += " -s -w"
          }

          go build --buildmode=exe "-ldflags=$ldflags" -o ./dist/${{ env.artifact_name }}-windows.exe ./cmd/backend

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-windows
          path: ./dist/${{ env.artifact_name }}-windows.exe

  build_android:
    runs-on: ubuntu-latest
    env:
      FFMPEGKIT_AAR_URL: https://repo1.maven.org/maven2/com/antonkarpenko/ffmpeg-kit-min/2.1.0/ffmpeg-kit-min-2.1.0.aar
    strategy:
      matrix:
        target:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android24-clang
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28
          add-to-path: false

      - name: Cache FFmpegKit JNI libs
        id: cache-ffmpegkit
        uses: actions/cache@v4
        with:
          path: .cache/ffmpeg-kit/jni
          key: ${{ runner.os }}-ffmpegkit-2.1.0-jni

      - name: Download and extract FFmpegKit AAR
        if: steps.cache-ffmpegkit.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p .cache/ffmpeg-kit

          curl -fL "$FFMPEGKIT_AAR_URL" -o .cache/ffmpeg-kit/ffmpeg-kit.aar
          cp .cache/ffmpeg-kit/ffmpeg-kit.aar .cache/ffmpeg-kit/ffmpeg-kit.zip

          rm -rf .cache/ffmpeg-kit/unpacked .cache/ffmpeg-kit/jni
          unzip -q .cache/ffmpeg-kit/ffmpeg-kit.zip -d .cache/ffmpeg-kit/unpacked

          if [ ! -d .cache/ffmpeg-kit/unpacked/jni ]; then
            echo "Extracted AAR does not contain jni/"
            exit 1
          fi

          mv .cache/ffmpeg-kit/unpacked/jni .cache/ffmpeg-kit/jni

      - name: Prepare FFmpegKit libs for ABI
        run: |
          set -euo pipefail
          ABI="${{ matrix.target.abi }}"

          if [ ! -f ".cache/ffmpeg-kit/jni/$ABI/libffmpegkit.so" ]; then
            echo "Missing .cache/ffmpeg-kit/jni/$ABI/libffmpegkit.so"
            exit 1
          fi

          mkdir -p "./lib/$ABI"
          cp -f ".cache/ffmpeg-kit/jni/$ABI/"*.so "./lib/$ABI/"

          echo "Prepared ./lib/$ABI"
          ls -la "./lib/$ABI"

      - name: Resolve Android clang path
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          fi
          if [ -z "$NDK_HOME" ]; then
            echo "Unable to find Android NDK path from setup-ndk output or ANDROID_NDK_LATEST_HOME/ANDROID_NDK_ROOT/ANDROID_NDK_HOME"
            exit 1
          fi

          CLANG_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.cc }}"
          if [ ! -x "$CLANG_BIN" ]; then
            echo "Android clang not found or not executable: $CLANG_BIN"
            exit 1
          fi

          echo "CC=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: Build Android shared library
        run: |
          LDFLAGS="-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384"
          if [ "${{ env.production }}" = "true" ]; then
            LDFLAGS="$LDFLAGS -s -w"
          fi

          go build -buildmode=c-shared -ldflags "$LDFLAGS" -o ./dist/lib${{ env.artifact_name }}-android-${{ matrix.target.abi }}.so ./cmd/androidlib
        env:
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/lib/${{ matrix.target.abi }} -lffmpegkit

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-android-${{ matrix.target.abi }}
          path: ./dist/lib${{ env.artifact_name }}-android-${{ matrix.target.abi }}.so

  upload_release:
    runs-on: ubuntu-latest
    needs: [ build_windows, build_linux, build_android ]
    if: github.event_name == 'release'
    strategy:
      matrix:
        arch: 
          - "linux-amd64"
          - "linux-arm64"
          - "windows"
          - "android-arm64-v8a"
          - "android-x86_64"
    permissions:
        contents: write
    steps:
      - uses: actions/download-artifact@v6
        id: download
        with:
          name: ${{ env.artifact_name }}-${{ matrix.arch }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.download.outputs.download-path }}/*
            
