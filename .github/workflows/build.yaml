name: Build Go Cross Platform

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  artifact_name: bilirec

on:
  push:
    branches:
      - '**'
  release:
    types:
      - created

jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [ "amd64", "arm64" ]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Build Linux
        run: |
          go build -ldflags "-X github.com/eric2788/bilirec/internal/modules/config.frpTokenInjected=${{ secrets.FRP_TOKEN }}" -o ./dist/${{ env.artifact_name }}-${{ matrix.goarch }}
        env:
          GOARCH: ${{ matrix.goarch }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-${{ matrix.goarch }}
          path: 'dist'

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Build Windows
        run: |
          go build --buildmode=exe "-ldflags=-X github.com/eric2788/bilirec/internal/modules/config.frpTokenInjected=${{ secrets.FRP_TOKEN }}" -o ./dist/${{ env.artifact_name }}-windows.exe

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-windows
          path: 'dist'

  upload_release:
    runs-on: ubuntu-latest
    needs: [ build_windows, build_linux ]
    if: github.event_name == 'release' && github.event.action == 'created'
    strategy:
      matrix:
        goarch: [ "amd64", "arm64", "windows" ]
    permissions:
        contents: write
    steps:
      - uses: actions/download-artifact@v6
        id: download
        with:
          name: ${{ env.artifact_name }}-${{ matrix.goarch }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.download.outputs.download-path }}/*
            