name: Build Go Cross Platform

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  artifact_name: bilirec
  production: ${{ github.event_name == 'release' }}

on:
  push:
    branches:
      - '**'
  release:
    types:
      - created


jobs:
  build_linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [ "amd64", "arm64" ]
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Build Linux
        run: |
          LDFLAGS="-X github.com/eric2788/bilirec/internal/modules/config.frpTokenInjected=${{ secrets.FRP_TOKEN }}"
          if [ "${{ env.production }}" = "true" ]; then
            LDFLAGS="$LDFLAGS -s -w"
          fi

          go build -ldflags "$LDFLAGS" -o ./dist/${{ env.artifact_name }}-linux-${{ matrix.goarch }} ./cmd/backend
        env:
          GOARCH: ${{ matrix.goarch }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-linux-${{ matrix.goarch }}
          path: ./dist/${{ env.artifact_name }}-linux-${{ matrix.goarch }}

  build_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Build Windows
        run: |
          $ldflags = "-X github.com/eric2788/bilirec/internal/modules/config.frpTokenInjected=${{ secrets.FRP_TOKEN }}"
          if ("${{ env.production }}" -eq "true") {
            $ldflags += " -s -w"
          }

          go build --buildmode=exe "-ldflags=$ldflags" -o ./dist/${{ env.artifact_name }}-windows.exe ./cmd/backend

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.artifact_name }}-windows
          path: ./dist/${{ env.artifact_name }}-windows.exe

  build_android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android24-clang
          - abi: x86_64
            goarch: amd64
            cc: x86_64-linux-android24-clang
    steps:
      - uses: actions/checkout@v6

      - name: Prepare Go and swagger docs
        uses: ./.github/actions/setup-go-swagger
        with:
          go-version: '1.25'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Resolve Android clang path
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK_HOME}}"
          if [ -z "$NDK_HOME" ]; then
            echo "Unable to find Android NDK path from ANDROID_NDK_LATEST_HOME/ANDROID_NDK_ROOT/ANDROID_NDK_HOME"
            exit 1
          fi

          CLANG_BIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target.cc }}"
          if [ ! -x "$CLANG_BIN" ]; then
            echo "Android clang not found or not executable: $CLANG_BIN"
            exit 1
          fi

          echo "CC=$CLANG_BIN" >> "$GITHUB_ENV"

      - name: Build Android shared library
        run: |
          LDFLAGS="-checklinkname=0 -extldflags=-Wl,-z,max-page-size=16384"
          if [ "${{ env.production }}" = "true" ]; then
            LDFLAGS="$LDFLAGS -s -w"
          fi

          go build -buildmode=c-shared -ldflags "$LDFLAGS" -o ./dist/lib${{ env.artifact_name }}-android-${{ matrix.target.abi }}.so ./cmd/androidlib
        env:
          GOOS: android
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "1"

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v6
        with:
          name: lib${{ env.artifact_name }}-android-${{ matrix.target.abi }}
          path: ./dist/lib${{ env.artifact_name }}-android-${{ matrix.target.abi }}.so

  upload_release:
    runs-on: ubuntu-latest
    needs: [ build_windows, build_linux, build_android ]
    if: github.event_name == 'release'
    strategy:
      matrix:
        goarch: [ "amd64", "arm64", "windows", "android-arm64-v8a", "android-x86_64" ]
    permissions:
        contents: write
    steps:
      - uses: actions/download-artifact@v6
        id: download
        with:
          name: ${{ env.artifact_name }}-${{ matrix.goarch }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.download.outputs.download-path }}/*
            