name: 手机版 BUG / 問題回報
description: bilirec-mobile App（前台服务、权限、存储、管理页、更新、闪退等）
title: "[手机] "
labels:
  - bug
  - mobile
body:
  - type: markdown
    attributes:
      value: |
        提交前请先阅读 [常见问题](https://www.bilirec.org/zh-cn/guides/faq/)。  
        录制内容、订阅、转码等请改用「核心 BUG / 問題回報」模板（环境栏注明手机内嵌后端）。当前仅 **Android** 支持内嵌录制。

  - type: checkboxes
    id: faq_ack
    attributes:
      label: 确认
      options:
        - label: 我已阅读常见问题
          required: true

  - type: input
    id: version
    attributes:
      label: App 版本
      placeholder: 例如 1.0.1
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 设备与环境
      description: 品牌型号、Android 版本、输出路径等你认为相关的信息
      placeholder: 例如 小米 14，Android 14，内置存储
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **附启动日志（内嵌后端问题强烈建议）**  
        1. 打开 App **开发者选项 → 环境变量**，添加 `DEBUG=true`（保存后需**重新启动**前台服务才生效）。  
        2. 按你的复现步骤再操作一次。  
        3. **开发者选项 → 启动日志** 导出合并后的 `bootstrap_*.log`，粘贴到下方或作为附件上传。  
        4. 问题解决后可删除 `DEBUG=true`，避免日志过多。  
        Android 内嵌后端日志走上述启动日志即可，**无需**设置 `LOCAL_LOGS_ENABLED`。

  - type: textarea
    id: logs
    attributes:
      label: bootstrap 日志或其它补充
      description: 建议按上方步骤开启 DEBUG 后复现并导出；可粘贴关键片段或说明已附附件
      placeholder: |
        （粘贴 bootstrap 日志片段，或写「见附件 bootstrap_xxx.log」）
